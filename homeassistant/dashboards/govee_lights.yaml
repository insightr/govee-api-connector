# Govee lights dashboard for Home Assistant.
#
# Paste the whole file into a new dashboard's raw configuration editor.
# Setup steps, including the nine light groups it uses, are in
# docs/home-assistant.md (Part 3).
#
# Tap a tile to open the colour wheel, white temperature and scene list.
# Tap a tile's icon to switch it on or off.
views:
  - title: Govee lights
    path: govee-lights
    icon: mdi:lightbulb-group
    type: sections
    max_columns: 3
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Garden
            icon: mdi:flower
          # The whole area. Needs the light group helper light.garden_all.
          - type: tile
            entity: light.garden_all
            name: Garden All
            features_position: bottom
            features:
              - type: light-brightness
              - type: light-color-temp
            grid_options:
              columns: full
          # Sub-groups.
          - type: tile
            entity: light.garden_top
            name: Garden Top
            features_position: bottom
            features:
              - type: light-brightness
            grid_options:
              columns: 6
          - type: tile
            entity: light.garden_bottom
            name: Garden Bottom
            features_position: bottom
            features:
              - type: light-brightness
            grid_options:
              columns: 6
          # Favourite scenes for every bulb in the area. To change one, edit
          # its name, icon and effect; the effect must match a scene name in
          # the light's scene list exactly.
          - type: button
            name: Movie
            icon: mdi:movie-open
            show_state: false
            tap_action:
              action: perform-action
              perform_action: light.turn_on
              target:
                entity_id:
                  - light.garden_lh_back_top
                  - light.garden_lh_back_bottom
                  - light.garden_lh_front_top
                  - light.garden_lh_front_bottom
                  - light.garden_rh_back_top
                  - light.garden_rh_back_bottom
                  - light.garden_rh_front_top
                  - light.garden_rh_front_bottom
              data:
                effect: Movie
            grid_options:
              columns: 3
              rows: 2
          - type: button
            name: Sunset Glow
            icon: mdi:weather-sunset
            show_state: false
            tap_action:
              action: perform-action
              perform_action: light.turn_on
              target:
                entity_id:
                  - light.garden_lh_back_top
                  - light.garden_lh_back_bottom
                  - light.garden_lh_front_top
                  - light.garden_lh_front_bottom
                  - light.garden_rh_back_top
                  - light.garden_rh_back_bottom
                  - light.garden_rh_front_top
                  - light.garden_rh_front_bottom
              data:
                effect: Sunset Glow
            grid_options:
              columns: 3
              rows: 2
          - type: button
            name: Aurora
            icon: mdi:aurora
            show_state: false
            tap_action:
              action: perform-action
              perform_action: light.turn_on
              target:
                entity_id:
                  - light.garden_lh_back_top
                  - light.garden_lh_back_bottom
                  - light.garden_lh_front_top
                  - light.garden_lh_front_bottom
                  - light.garden_rh_back_top
                  - light.garden_rh_back_bottom
                  - light.garden_rh_front_top
                  - light.garden_rh_front_bottom
              data:
                effect: Aurora
            grid_options:
              columns: 3
              rows: 2
          - type: button
            name: Candlelight
            icon: mdi:candle
            show_state: false
            tap_action:
              action: perform-action
              perform_action: light.turn_on
              target:
                entity_id:
                  - light.garden_lh_back_top
                  - light.garden_lh_back_bottom
                  - light.garden_lh_front_top
                  - light.garden_lh_front_bottom
                  - light.garden_rh_back_top
                  - light.garden_rh_back_bottom
                  - light.garden_rh_front_top
                  - light.garden_rh_front_bottom
              data:
                effect: Candlelight
            grid_options:
              columns: 3
              rows: 2
          # Individual bulbs.
          - type: tile
            entity: light.garden_lh_back_top
            name: LH back top
            features_position: bottom
            features:
              - type: light-brightness
            grid_options:
              columns: 6
          - type: tile
            entity: light.garden_lh_back_bottom
            name: LH back bottom
            features_position: bottom
            features:
              - type: light-brightness
            grid_options:
              columns: 6
          - type: tile
            entity: light.garden_lh_front_top
            name: LH front top
            features_position: bottom
            features:
              - type: light-brightness
            grid_options:
              columns: 6
          - type: tile
            entity: light.garden_lh_front_bottom
            name: LH front bottom
            features_position: bottom
            features:
              - type: light-brightness
            grid_options:
              columns: 6
          - type: tile
            entity: light.garden_rh_back_top
            name: RH back top
            features_position: bottom
            features:
              - type: light-brightness
            grid_options:
              columns: 6
          - type: tile
            entity: light.garden_rh_back_bottom
            name: RH back bottom
            features_position: bottom
            features:
              - type: light-brightness
            grid_options:
              columns: 6
          - type: tile
