# F1 track status lighting for Home Assistant.
#
# Needs: the F1 Sensor integration with live data enabled, and the Govee bulbs
# present as light entities. The list of bulbs is in the first script below.
# Setup steps are in docs/home-assistant.md.
#
# Things you may want to change are marked EDIT.

# ---- Controls for the dashboard --------------------------------------------
input_boolean:
  f1_lights_enabled:
    name: F1 lights enabled
    icon: mdi:flag-checkered
  # Rehearsal: behave as if a session is live, with the track status taken
  # from the "F1 lights rehearsal status" dropdown instead of the F1 Sensor.
  f1_lights_rehearsal:
    name: F1 lights rehearsal
    icon: mdi:test-tube
  # Set by the automation while the lights are following the track.
  # Shows what it is doing; do not switch it by hand.
  f1_lights_running:
    name: F1 lights running
    icon: mdi:car-sports

input_select:
  f1_lights_rehearsal_status:
    name: F1 lights rehearsal status
    icon: mdi:flag
    options: [CLEAR, YELLOW, VSC, SC, RED]

input_number:
  f1_lights_delay:
    name: F1 lights extra delay
    icon: mdi:timer-outline
    min: 0
    max: 120
    step: 1
    unit_of_measurement: s
    mode: box

script:
  f1_lights_save:
    alias: F1 lights - remember current lighting
    sequence:
      - action: scene.create
        data:
          scene_id: f1_lights_before
          # ---- Which lights follow the race ----
          # EDIT: this is the one list of lights. Every other step reuses it
          # (wherever you see *f1_lights). IDs must match Developer Tools > States.
          snapshot_entities: &f1_lights
            - light.cinema_left
            - light.cinema_right
            - light.sofa_left
            - light.sofa_right
            - light.balcony_lh_top
            - light.balcony_lh_bottom
            - light.balcony_m_top
            - light.balcony_m_bottom
            - light.balcony_rh_top
            - light.balcony_rh_bottom
            - light.garden_lh_back_top
            - light.garden_lh_back_bottom
            - light.garden_lh_front_top
            - light.garden_lh_front_bottom
            - light.garden_rh_back_top
            - light.garden_rh_back_bottom
            - light.garden_rh_front_top
            - light.garden_rh_front_bottom

  f1_lights_apply:
    alias: F1 lights - show track status
    description: Set the F1 lights to the colour for a track status. Defaults to the current one.
    mode: restart
    fields:
      status:
        description: CLEAR, YELLOW, VSC, SC or RED. Leave empty to use the live status.
        example: YELLOW
    sequence:
      - variables:
          track_status: "{{ status | default(states('sensor.f1_track_status'), true) }}"
      # EDIT: colours are [red, green, blue], each 0 to 255. brightness_pct is 1 to 100.
      - choose:
          - conditions: "{{ track_status == 'CLEAR' }}"
            sequence:
              - action: light.turn_on
                target:
                  entity_id: *f1_lights
                data:
                  rgb_color: [0, 255, 0]
                  brightness_pct: 100
          - conditions: "{{ track_status == 'YELLOW' }}"
            sequence:
              - action: light.turn_on
                target:
                  entity_id: *f1_lights
                data:
                  rgb_color: [255, 200, 0]
                  brightness_pct: 100
          - conditions: "{{ track_status in ['VSC', 'SC'] }}"
            sequence:
              - action: light.turn_on
                target:
                  entity_id: *f1_lights
                data:
                  rgb_color: [255, 100, 0]
                  brightness_pct: 100
          - conditions: "{{ track_status == 'RED' }}"
            sequence:
              - action: light.turn_on
                target:
                  entity_id: *f1_lights
                data:
                  rgb_color: [255, 0, 0]
                  brightness_pct: 100

  f1_lights_restore:
    alias: F1 lights - put lighting back
    sequence:
      # Do nothing if no lighting has been saved yet.
      - condition: template
        value_template: "{{ states.scene.f1_lights_before is not none }}"
      - action: scene.turn_on
        target:
          entity_id: scene.f1_lights_before

  f1_lights_test:
    alias: F1 lights - test every colour
    description: Saves the lighting, shows each track status for 5 seconds, then puts it back.
    mode: single
    sequence:
      - action: script.f1_lights_save
      - repeat:
          for_each: [CLEAR, YELLOW, VSC, RED, CLEAR]
          sequence:
            - action: script.f1_lights_apply
              data:
                status: "{{ repeat.item }}"
            - delay: 5
      - action: script.f1_lights_restore

automation:
  - id: f1_lights_controller
    alias: F1 lights - controller
    description: Follows the track status on the F1 lights during a session or rehearsal.
    # restart: a newer change replaces one still waiting out a delay.
    mode: restart
    triggers:
      - trigger: state
        entity_id:
          - input_boolean.f1_lights_enabled
          - input_boolean.f1_lights_rehearsal
          - input_select.f1_lights_rehearsal_status
          - sensor.f1_session_status
          - sensor.f1_current_session
          - sensor.f1_track_status
    conditions:
      # Ignore updates where only attributes changed.
      - condition: template
        value_template: >
          {{ trigger.from_state is none or trigger.to_state is none
             or trigger.from_state.state != trigger.to_state.state }}
    actions:
      - variables:
          # Should the lights be following the track right now?
          # "suspended" (red flag) and "break" (between qualifying parts) count as running.
          # EDIT: add 'Practice 1', 'Practice 2', 'Practice 3' to include practice.
          wanted: >
            {{ is_state('input_boolean.f1_lights_enabled', 'on')
               and (is_state('input_boolean.f1_lights_rehearsal', 'on')
                    or (states('sensor.f1_session_status') in ['live', 'suspended', 'break']
                        and states('sensor.f1_current_session') in
                          ['Race', 'Sprint', 'Qualifying', 'Sprint Qualifying'])) }}
          running: "{{ is_state('input_boolean.f1_lights_running', 'on') }}"
          # The status to show: the dropdown in rehearsal, otherwise the F1 Sensor.
          track_status: >
            {{ states('input_select.f1_lights_rehearsal_status')
               if is_state('input_boolean.f1_lights_rehearsal', 'on')
               else states('sensor.f1_track_status') }}
          status_changed: >
            {{ trigger.entity_id in ['sensor.f1_track_status',
                 'input_select.f1_lights_rehearsal_status',
                 'input_boolean.f1_lights_rehearsal'] }}
          delay_seconds: "{{ states('input_number.f1_lights_delay') | float(0) }}"
      - choose:
          # Starting: remember the lighting, then show the track status.
          - conditions: "{{ wanted and not running }}"
            sequence:
              - action: script.f1_lights_save
              - action: input_boolean.turn_on
                target:
                  entity_id: input_boolean.f1_lights_running
              - action: script.f1_lights_apply
                data:
                  status: "{{ track_status }}"
          # Running and the status changed: wait out the delay, then show it.
          - conditions: "{{ wanted and running and status_changed }}"
            sequence:
              - delay:
                  seconds: "{{ delay_seconds }}"
              - action: script.f1_lights_apply
                data:
                  status: "{{ track_status }}"
          # Stopping: put the lighting back. If the session finished (rather
          # than a switch being turned off), show white for a minute first.
          - conditions: "{{ not wanted and running }}"
            sequence:
              - if:
                  - condition: state
                    entity_id: input_boolean.f1_lights_enabled
                    state: "on"
                  - condition: state
                    entity_id: sensor.f1_session_status
                    state: [finished, finalised, ended]
                then:
                  - delay:
                      seconds: "{{ delay_seconds }}"
                  - action: light.turn_on
                    target:
                      entity_id: *f1_lights
                    data:
                      color_temp_kelvin: 4000
                      brightness_pct: 100
                  - delay: 60
              - action: script.f1_lights_restore
              - action: input_boolean.turn_off
                target:
                  entity_id: input_boolean.f1_lights_running
